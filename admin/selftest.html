<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="X-Robots-Tag" content="noindex, nofollow"><title>Admin self-tests</title><link rel="stylesheet" href="/admin/css/admin.css"></head><body><main style="margin:0 auto;max-width:900px;padding:24px"><a href="/admin/">← Workspace</a><h1>Local admin self-tests</h1><p class="muted">Tests run in this browser and use a temporary record that is removed afterward.</p><button class="button primary" id="run">Run tests</button><ol id="results" aria-live="polite"></ol></main><script src="/admin/js/validate.js"></script><script src="/admin/js/store.js"></script><script>
const results=document.getElementById('results');document.getElementById('run').addEventListener('click',async()=>{results.replaceChildren();const test=async(name,fn)=>{const li=document.createElement('li');try{await fn();li.textContent=`PASS — ${name}`;li.style.color='#28643a';}catch(error){li.textContent=`FAIL — ${name}: ${error.message}`;li.style.color='#a43e31';}results.append(li);};
await test('Store create/read/update/delete round-trip',async()=>{await AdminStore.open();const record=await AdminStore.put('projects',{id:'selftest-roundtrip',name:'test'});if(!(await AdminStore.all('projects')).some(x=>x.id===record.id))throw Error('create/read failed');await AdminStore.put('projects',{...record,name:'updated'});if(!(await AdminStore.all('projects')).some(x=>x.id===record.id&&x.name==='updated'))throw Error('update failed');await AdminStore.remove('projects',record.id);if((await AdminStore.all('projects')).some(x=>x.id===record.id))throw Error('delete failed');});
await test('Export/import round-trip equality',async()=>{const record={id:'selftest-import-roundtrip',name:'Self-test record',lang:'en',status:'Draft',translationGroup:'selftest-import-roundtrip',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const payload={schemaVersion:1,exportedAt:new Date().toISOString(),collections:{projects:[record]}};if(!AdminValidate.validateImport(payload).ok)throw Error('export rejected');await AdminStore.importData(payload,false);const exported=await AdminStore.exportData(),found=exported.collections.projects.find(item=>item.id===record.id);if(!found||found.name!==record.name)throw Error('import/export round-trip differs');await AdminStore.remove('projects',record.id);});
await test('Schema validation rejects invalid JSON',async()=>{if(AdminValidate.validateImport({schemaVersion:9,collections:{}}).ok)throw Error('bad version accepted');});
await test('HTTPS URL validator',async()=>{if(!AdminValidate.url('https://abbosov.com/').ok||AdminValidate.url('javascript:alert(1)').ok)throw Error('URL rules failed');});
await test('Uzbek and Russian transliteration slug',async()=>{if(AdminValidate.slug('Oʻzbekiston')!=='ozbekiston'||AdminValidate.slug('Привет мир')!=='privet-mir')throw Error(`unexpected slugs ${AdminValidate.slug('Oʻzbekiston')} / ${AdminValidate.slug('Привет мир')}`);});
await test('Whitelist sanitizer removes scripts and event handlers',async()=>{const fragment=AdminValidate.sanitize('<p onclick="x()">ok</p><script>alert(1)<\/script><img src=x onerror=alert(1)>');const host=document.createElement('div');host.append(fragment);if(host.querySelector('script,img,[onclick],[onerror]'))throw Error('unsafe nodes remain');});
await test('Translation matrix groups language copies',async()=>{const records=[{translationGroup:'a',lang:'en'},{translationGroup:'a',lang:'uz'}],langs=new Set(records.filter(x=>x.translationGroup==='a').map(x=>x.lang));if(!['en','uz','ru'].every(x=>langs.has(x)===['en','uz'].includes(x)))throw Error('matrix mismatch');});
});</script></body></html>
